name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # same image as the Dockerfile; Tycho 2.7 breaks with some newer Maven versions
    container: maven:3.9.16-eclipse-temurin-17
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: m2-

      - name: Build and test
        working-directory: com.zazuko.rdfmapping.dsl.parent
        run: >
          mvn -B verify
          -pl com.zazuko.rdfmapping.dsl.target,com.zazuko.rdfmapping.dsl,com.zazuko.rdfmapping.dsl.ide,com.zazuko.rdfmapping.dsl.tests

      - name: Compare generated samples with committed src-gen
        run: |
          jar=$(ls com.zazuko.rdfmapping.dsl.parent/com.zazuko.rdfmapping.dsl.ide/target/*-cli.jar)
          XRM="java -jar $jar" scripts/check-samples.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xrm-cli
          path: com.zazuko.rdfmapping.dsl.parent/com.zazuko.rdfmapping.dsl.ide/target/*-cli.jar

  # Rolling pre-release per branch with a stable download URL:
  # https://github.com/zazuko/xrm/releases/download/<branch>-snapshot/xrm-cli.jar
  snapshot:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: snapshot-${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xrm-cli

      - name: Update snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="${BRANCH//\//-}-snapshot"
          mv *-cli.jar xrm-cli.jar
          notes="Latest successful build of branch \`$BRANCH\` ($GITHUB_SHA). Replaced on every push."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --notes "$notes"
            gh release upload "$tag" xrm-cli.jar --clobber
          else
            gh release create "$tag" xrm-cli.jar --prerelease --target "$GITHUB_SHA" \
              --title "$BRANCH snapshot" --notes "$notes"
          fi
