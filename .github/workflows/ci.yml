name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        working-directory: com.zazuko.rdfmapping.dsl.parent
        run: >
          mvn -B verify
          -pl com.zazuko.rdfmapping.dsl.target,com.zazuko.rdfmapping.dsl,com.zazuko.rdfmapping.dsl.ide,com.zazuko.rdfmapping.dsl.tests

      - name: Compare generated samples with committed src-gen
        run: |
          jar=$(ls com.zazuko.rdfmapping.dsl.parent/com.zazuko.rdfmapping.dsl.ide/target/*-cli.jar)
          XRM="java -jar $jar" scripts/check-samples.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xrm-cli
          path: com.zazuko.rdfmapping.dsl.parent/com.zazuko.rdfmapping.dsl.ide/target/*-cli.jar
