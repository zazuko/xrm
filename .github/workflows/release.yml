name: Publish CLI

# Version tags (e.g. 1.7.0) publish the CLI jar on the GitHub release and the
# Docker image as ghcr.io/zazuko/xrm:<version> and :latest.
# Branch pushes publish ghcr.io/zazuko/xrm:<branch> (e.g. :main).
on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  jar:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        working-directory: com.zazuko.rdfmapping.dsl.parent
        run: >
          mvn -B package -DskipTests
          -pl com.zazuko.rdfmapping.dsl.target,com.zazuko.rdfmapping.dsl,com.zazuko.rdfmapping.dsl.ide

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp com.zazuko.rdfmapping.dsl.parent/com.zazuko.rdfmapping.dsl.ide/target/*-cli.jar "xrm-cli-$TAG.jar"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "xrm-cli-$TAG.jar" --clobber
